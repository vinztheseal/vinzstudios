<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VINZS STUDIOS — Vinz</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --purple: #7d4ca3;
      --dark-purple: #392446;
      --light-purple: #eee2f7;
      --soft-purple: #f7f0fb;
      --pink: #d9a9e8;
      --text: #403449;
      --muted: #806f87;
      --white: #fffaff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, #ead8f5 0, transparent 25%),
        radial-gradient(circle at 90% 30%, #e1c8ef 0, transparent 25%),
        #f5edf8;
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    /* NAVBAR */

    nav {
      position: sticky;
      top: 15px;
      z-index: 10;

      max-width: 1100px;
      margin: 15px auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 15px 22px;

      background: rgba(255, 250, 255, .88);
      backdrop-filter: blur(15px);

      border: 1px solid #eadcf0;
      border-radius: 22px;

      box-shadow: 0 10px 30px rgba(70, 40, 85, .08);
    }

    .logo {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      letter-spacing: -.5px;
      color: var(--dark-purple);
    }

    .logo span {
      color: var(--purple);
    }

    nav a {
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      transition: .2s;
    }

    nav a:hover {
      color: var(--purple);
    }

    /* MAIN */

    main {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px 70px;
    }

    /* HERO */

    .hero {
      min-height: 520px;

      display: grid;
      grid-template-columns: 1.2fr .8fr;
      align-items: center;

      padding: 65px;

      border-radius: 35px;

      background:
        radial-gradient(circle at 85% 30%, #cfa5df, transparent 25%),
        linear-gradient(135deg, #5d3978, #8d5baa);

      color: white;

      overflow: hidden;
      position: relative;

      box-shadow: 0 25px 60px rgba(72, 40, 90, .22);
    }

    .hero::before {
      content: "✦  ·  ✧  ·  ✦  ·  ✧";
      position: absolute;
      top: 30px;
      right: 45px;
      opacity: .35;
      font-size: 22px;
      letter-spacing: 10px;
    }

    .hero::after {
      content: "♡";
      position: absolute;
      bottom: -40px;
      left: 35%;
      font-size: 170px;
      opacity: .06;
    }

    .eyebrow {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: .75;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(52px, 9vw, 95px);
      line-height: .88;
      letter-spacing: -5px;
      margin-bottom: 25px;
    }

    .hero h1 span {
      color: #ead5f3;
    }

    .hero p {
      max-width: 540px;
      font-size: 18px;
      opacity: .9;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 13px 21px;

      background: white;
      color: var(--purple);

      text-decoration: none;
      font-weight: 700;

      border-radius: 14px;

      transition: .2s;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,.15);
    }

    .mascot {
      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 170px;

      filter: drop-shadow(0 20px 20px rgba(30, 15, 40, .25));
      transform: rotate(2deg);
    }

    /* SECTIONS */

    section {
      margin-top: 80px;
    }

    .section-heading {
      margin-bottom: 25px;
    }

    .section-heading small {
      color: var(--purple);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .section-heading h2 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 38px;
      color: var(--dark-purple);
      margin-top: 4px;
    }

    .section-heading p {
      color: var(--muted);
      max-width: 650px;
      margin-top: 5px;
    }

    /* ABOUT */

    .about {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .box {
      background: rgba(255,250,255,.82);
      border: 1px solid #eadcf0;
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 12px 30px rgba(70,40,85,.06);
    }

      color:
